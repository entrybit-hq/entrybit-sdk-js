name: Bug report
description: Report a defect in @entrybit/sdk
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include API keys, access tokens, or other secrets in this report. For security vulnerabilities, email security@entrybit.net instead of filing an issue.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Output of `npm ls @entrybit/sdk`
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.11.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or sequence of steps that reproduces the behavior. Redact all credentials.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, stack traces, or response bodies. Redact all credentials and personal data.
      render: text
    validations:
      required: false
