# Weekly dependency updates, grouped so version bumps arrive as one
# reviewable pull request per ecosystem instead of a trickle.
# The chore(deps) prefix keeps PR titles conventional-commit compliant,
# which the semantic PR title check requires for merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 is blocked until openapi-typescript and typescript-eslint
      # declare support for it (their peer ranges reject it today).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
    # The SDK has zero runtime dependencies; if one ever appears it will
    # surface as its own ungrouped pull request and deserve scrutiny.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
