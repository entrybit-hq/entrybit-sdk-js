name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly supply-chain posture sweep.
    - cron: "45 6 * * 1"

permissions: read-all

jobs:
  # Scorecard is built for public repositories: on a private one the SARIF
  # upload needs Code Security and the action silently disables
  # publish_results. Checked via the API because `github.event.repository` is
  # not populated on scheduled runs; the analysis activates automatically when
  # the repository becomes public.
  visibility:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public=$(gh api "repos/${{ github.repository }}" --jq 'if .private then "false" else "true" end')
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "Repository public: $public"

  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    permissions:
      # Needed to upload results to code scanning.
      security-events: write
      # Needed to publish results and get a badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
