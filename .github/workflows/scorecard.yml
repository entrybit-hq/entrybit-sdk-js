name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly supply-chain posture sweep.
    - cron: "45 6 * * 1"

permissions: read-all

jobs:
  # Scorecard is built for public repositories: on a private one the SARIF
  # upload needs Code Security and the action silently disables
  # publish_results. Checked via the API because `github.event.repository` is
  # not populated on scheduled runs; the analysis activates automatically when
  # the repository becomes public.
  visibility:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public=$(gh api "repos/${{ github.repository }}" --jq 'if .private then "false" else "true" end')
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "Repository public: $public"

  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    permissions:
      # Needed to upload results to code scanning.
      security-events: write
      # Needed to publish results and get a badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
