name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly supply-chain posture sweep.
    - cron: "45 6 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard is built for public repos: on a private repo checkout lacks
    # contents scope here, upload-sarif needs GHAS, and the action silently
    # disables publish_results. Dormant until the repository goes public.
    if: ${{ !github.event.repository.private }}
    permissions:
      # Needed to upload results to code scanning.
      security-events: write
      # Needed to publish results and get a badge.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
