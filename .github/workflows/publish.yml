name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Needed for npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Generate types from committed spec
        run: npm run generate

      - name: Check generated types are committed (no drift)
        run: git diff --exit-code -- src/generated

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tarball contents
        run: npm run pack:verify

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # An npm automation token authorized to publish @entrybit/sdk;
          # set as a repository secret by an administrator (see CONTRIBUTING.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
