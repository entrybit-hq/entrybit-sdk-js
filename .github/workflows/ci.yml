name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      # Non-blocking: the SDK has zero runtime dependencies, so this only
      # covers future production deps. Advisory data changes independently of
      # the code under review; surfacing it must not fail unrelated builds.
      - name: Audit production dependencies (advisory only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Generate types from committed spec
        run: npm run generate

      - name: Check generated types are committed (no drift)
        run: git diff --exit-code -- src/generated

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tarball contents
        run: npm run pack:verify
