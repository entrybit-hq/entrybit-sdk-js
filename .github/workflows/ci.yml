name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 pins the exact engines floor so it is actually exercised;
        # 22 and 24 are the maintenance and active LTS lines.
        node-version: ["20.19.0", 22, 24]
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts: no dependency postinstall executes on untrusted fork
      # PRs. The toolchain (tsup/esbuild, vitest, tsc) works without install
      # scripts — esbuild resolves its binary via optional platform packages.
      - name: Install
        run: npm ci --ignore-scripts

      # Non-blocking: the SDK has zero runtime dependencies, so this only
      # covers future production deps. Advisory data changes independently of
      # the code under review; surfacing it must not fail unrelated builds.
      - name: Audit production dependencies (advisory only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Generate types from committed spec
        run: npm run generate

      - name: Check generated types are committed (no drift)
        run: git diff --exit-code -- src/generated

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Smoke both build outputs: a broken CJS interop or exports-map
      # regression fails here, not in a consumer's project.
      - name: Smoke-test dist (ESM + CJS)
        run: |
          node --input-type=module -e "import('./dist/index.js').then((m) => { if (typeof m.EntryBit !== 'function') { throw new Error('ESM export broken'); } })"
          node -e "const { EntryBit } = require('./dist/index.cjs'); if (typeof EntryBit !== 'function') { throw new Error('CJS export broken'); }"

      # publint validates the package manifest; attw catches type-resolution
      # hazards (e.g. ESM types paired with the CJS entry under node10).
      - name: Check exports and types resolution
        run: npm run check:exports

      - name: Verify tarball contents
        run: npm run pack:verify
